# Runtime packages for the browser-based JupyterLite site.
name: imagequant101-lite
channels:
  - https://prefix.dev/emscripten-forge-4x
  - https://prefix.dev/conda-forge
dependencies:
  - xeus-python
  - imageio
  - ipympl
  - matplotlib
  - numpy
  - pandas
  - pyefd
  - scikit-image
  - scikit-learn
  - scipy
  - seaborn
